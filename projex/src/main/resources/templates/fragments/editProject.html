<div class="min-h-screen bg-gray-50 flex w-full" th:fragment="editProject">
    
    <div class="hidden md:block md:w-72 shrink-0"></div>

    <div class="flex-grow flex flex-col items-center justify-start py-10 px-4 sm:px-10">
        
        <div class="w-full max-w-3xl bg-white rounded-[2.5rem] shadow-2xl shadow-purple-200/40 border border-gray-100 overflow-hidden">
            
            <div class="bg-purple-600 p-10 text-center relative overflow-hidden">
                <div class="absolute top-[-20px] right-[-20px] w-24 h-24 bg-white/10 rounded-full"></div>
                <div class="absolute bottom-[-10px] left-[-10px] w-16 h-16 bg-white/5 rounded-full"></div>
                
                <h2 class="text-3xl font-black text-white relative z-10">Editar Projeto</h2>
                <p class="text-purple-100 text-sm mt-2 opacity-90 relative z-10">Atualize as informações do seu projeto</p>
            </div>

            <form th:action="@{/panelProjetos/{id}/editar(id=${projeto.id})}" th:object="${projeto}" method="post" class="p-8 md:p-12 space-y-8">
                
                <input type="hidden" th:field="*{id}">

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div class="flex flex-col md:col-span-2">
                        <label class="text-xs uppercase tracking-widest font-bold text-gray-400 mb-2 ml-1">Título do Projeto</label>
                        <input type="text" th:field="*{titulo}" placeholder="Ex: App de Gestão Financeira"
                               class="w-full border-2 border-gray-100 bg-gray-50 rounded-2xl px-5 py-4 focus:bg-white focus:border-purple-500 focus:ring-4 focus:ring-purple-100 outline-none transition-all shadow-sm"/>
                    </div>

                    <div class="flex flex-col">
                        <label class="text-xs uppercase tracking-widest font-bold text-gray-400 mb-2 ml-1">Status</label>
                        <select th:field="*{status}" id="status"
                                class="w-full border-2 border-gray-100 bg-gray-50 rounded-2xl px-5 py-4 focus:bg-white focus:border-purple-500 outline-none transition-all cursor-pointer text-gray-600 shadow-sm">
                            <option value="SELECIONE_OPCAO">Selecione uma opção</option>
                            <option value="EM_ANDAMENTO">Em andamento</option>
                            <option value="CONCLUIDO">Concluído</option>
                            <option value="CANCELADO">Cancelado</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label class="text-xs uppercase tracking-widest font-bold text-gray-400 mb-2 ml-1">Data de Conclusão</label>
                        <input type="date" th:field="*{dataConclusao}"
                               class="w-full border-2 border-gray-100 bg-gray-50 rounded-2xl px-5 py-4 focus:bg-white focus:border-purple-500 outline-none transition-all text-gray-600 shadow-sm"/>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label class="text-xs uppercase tracking-widest font-bold text-gray-400 mb-2 ml-1">Descrição Detalhada</label>
                    <textarea th:field="*{descricao}" rows="4" placeholder="Conte os detalhes do projeto..."
                              class="w-full border-2 border-gray-100 bg-gray-50 rounded-2xl px-5 py-4 focus:bg-white focus:border-purple-500 outline-none transition-all resize-none shadow-sm"></textarea>
                </div>

                <div class="flex flex-col">
                    <label class="text-xs uppercase tracking-widest font-bold text-gray-400 mb-2 ml-1">Tecnologias (Tags)</label>
                    <div id="tag-container"
                         class="border-2 border-dashed border-gray-200 rounded-2xl px-5 py-4 min-h-[70px] flex flex-wrap gap-2 cursor-text hover:border-purple-300 hover:bg-purple-50/30 transition-all shadow-inner"
                         onclick="document.getElementById('tag-input').focus()">
                        
                        <input id="tag-input" type="text"
                               placeholder="Digite e use ';'..."
                               class="outline-none flex-grow min-w-[150px] bg-transparent text-sm"/>
                    </div>
                    <input type="hidden" th:field="*{tecnologiasText}" id="tecnologiasText">
                </div>

                <div class="flex flex-col sm:flex-row items-center gap-4 pt-6">
                    <a th:href="@{/panelProjetos}" 
                       class="w-full sm:w-1/3 order-2 sm:order-1 py-4 px-6 rounded-2xl font-bold text-gray-400 hover:bg-gray-100 transition-all text-center">
                        Cancelar
                    </a>
                    <button type="submit"
                            class="w-full sm:w-2/3 order-1 sm:order-2 py-4 px-6 rounded-2xl font-bold text-white bg-purple-600 hover:bg-purple-700 shadow-xl shadow-purple-200 active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="bi bi-floppy"></i> Salvar Alterações
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

</div>
    <script src="/js/tags.js"></script>
</div>

<script src="/js/notificacao.js"></script>
