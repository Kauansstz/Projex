<div class="flex flex-col m-auto ml-0 lg:ml-[16rem] 2xl:ml-[20rem] p-4 lg:p-8 w-full max-w-[1200px]" th:fragment="editAccount">
    
    <form th:action="@{/editAccount/{id}/atualizar(id=${usuario.id})}" th:object="${usuario}" method="POST" enctype="multipart/form-data">
        <input type="hidden" th:field="*{id}">

        <div class="bg-white rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden relative">
            
            <div class="h-32 bg-gradient-to-r from-[#6366F1] to-[#8B5CF6] relative">
                <a th:href="@{/panelAccount}" 
                   class="absolute top-6 left-6 bg-white/20 hover:bg-white/40 text-white p-2 rounded-xl backdrop-blur-md transition-all">
                    <i class="bi bi-arrow-left text-xl"></i>
                </a>
                <div class="absolute bottom-4 right-6 text-white/80 text-sm font-medium">
                    Editando Perfil Profissional
                </div>
            </div>

            <div class="px-6 md:px-10 pb-12">
                
                <div class="relative flex flex-col md:flex-row md:items-end gap-6 -mt-12 mb-10">
                    <div class="group relative w-32 h-32 bg-white rounded-[2.5rem] p-2 shadow-lg flex-shrink-0 mx-auto md:mx-0">
                        <div class="w-full h-full bg-gray-100 rounded-[2rem] flex items-center justify-center text-[#6366F1] overflow-hidden">
                            <i th:if="*{fotoPerfil == null or fotoPerfil.isEmpty()}" class="bi bi-person-circle text-6xl"></i>
                            <img th:unless="*{fotoPerfil == null or fotoPerfil.isEmpty()}" th:src="*{${usuario.fotoPerfil != null ? usuario.fotoPerfil : '/img/default-user.png'}}" class="w-full h-full object-cover">
                            
                            <label class="absolute inset-0 flex items-center justify-center bg-black/40 opacity-0 group-hover:opacity-100 cursor-pointer transition-opacity rounded-[2.5rem]">
                                <input type="file" name="fileFoto" class="hidden" accept="image/*">
                                <i class="bi bi-camera-fill text-white text-2xl"></i>
                            </label>
                        </div>
                    </div>
                    
                    <div class="flex-1 pb-2 text-center md:text-left">
                        <label class="text-xs font-black text-gray-400 uppercase tracking-widest ml-1">Título do Perfil</label>
                        <input type="text" th:field="*{name}" placeholder="Seu nome completo"
                               class="w-full text-2xl font-black text-gray-900 bg-transparent border-b-2 border-dashed border-gray-200 focus:border-[#6366F1] focus:outline-none transition-colors">
                    </div>
                    
                    <div class="flex gap-3 pb-2 justify-center md:justify-end">
                        <button type="submit" class="flex items-center gap-2 px-6 py-3 bg-[#6366F1] hover:bg-[#4F46E5] text-white font-bold rounded-2xl shadow-lg shadow-indigo-200 transition-all">
                            <i class="bi bi-check-lg"></i> Salvar Alterações
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    
                    <div class="lg:col-span-1 space-y-6">
                        <section class="bg-gray-50 rounded-3xl p-6 border border-gray-100 space-y-4">
                            <h3 class="font-bold text-gray-800 flex items-center gap-2 mb-2">
                                <i class="bi bi-briefcase text-[#6366F1]"></i> Profissional
                            </h3>
                            
                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Cargo Atual</label>
                                <input type="text" th:field="*{cargo}" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-100 focus:outline-none">
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Empresa</label>
                                <input type="text" th:field="*{empresa}" class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-100 focus:outline-none">
                            </div>

                            <div>
                                <label class="text-[10px] font-bold text-gray-400 uppercase ml-1">Bio Curta (Descrição)</label>
                                <input type="text" th:field="*{descricao}" placeholder="Ex: Desenvolvedor Fullstack"
                                       class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-indigo-100 focus:outline-none">
                            </div>
                        </section>

                        <section class="bg-gray-50 rounded-3xl p-6 border border-gray-100 space-y-4">
                            <h3 class="font-bold text-gray-800 flex items-center gap-2 mb-2">
                                <i class="bi bi-telephone text-[#6366F1]"></i> Contato
                            </h3>
                            <input type="text" th:field="*{telefone}" placeholder="(00) 00000-0000"
                                   class="w-full bg-white border border-gray-200 rounded-xl px-4 py-2.5 text-sm">
                        </section>
                    </div>

                    <div class="lg:col-span-2 space-y-8">
                        
                        <section>
                            <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-3">
                                <i class="bi bi-chat-left-text text-[#6366F1] text-xl"></i> Sobre Mim
                            </h3>
                            <textarea th:field="*{sobre}" rows="8" 
                                      class="w-full bg-gray-50 rounded-2xl p-6 border border-gray-100 text-gray-600 text-sm focus:ring-2 focus:ring-indigo-100 focus:outline-none shadow-inner"
                                      placeholder="Conte um pouco sobre sua trajetória..."></textarea>
                        </section>

                        <div class="flex flex-col">
                            <label class="text-xs uppercase tracking-widest font-bold text-gray-400 mb-2 ml-1">Tecnologias (Tags)</label>
                            <div id="tag-container"
                                class="border-2 border-dashed border-gray-200 rounded-2xl px-5 py-4 min-h-[70px] flex flex-wrap gap-2 cursor-text hover:border-purple-300 hover:bg-purple-50/30 transition-all shadow-inner"
                                onclick="document.getElementById('tag-input').focus()">
                                <input id="tag-input" type="text"
                                    placeholder="Digite e use ';'..."
                                    class="outline-none flex-grow min-w-[150px] bg-transparent text-sm"/>
                            </div>
                            <input type="hidden" th:field="*{tecnologiasText}" id="tecnologiasText">
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </form>
     <div th:if="${mensagemErro}" 
        role="alert" 
        id="alert"
        >
        <p th:text="${mensagemErro}" class="font-medium"></p>
    </div>
    
        <div th:if="${mensagemSucesso}" 
        role="alert" 
        id="alert-sucesso"
        th:text="${mensagemSucesso}">
        
    </div>
</div>
