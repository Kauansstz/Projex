<div class="flex min-h-screen bg-slate-50 py-12 pl-0 md:pl-64 justify-center items-start font-sans" th:fragment="editUser">

    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden mx-6">
        
        <div class="bg-gradient-to-r from-purple-700 to-indigo-600 px-8 py-10 text-white">
            <h2 class="text-3xl font-extrabold tracking-tight">
                Central do Usuário
            </h2>
            <p class="text-purple-100 mt-2">Mantenha seu perfil atualizado para a comunidade.</p>
        </div>

        <form method="post"
              th:action="@{/panelUser/editar/{id}(id=${user.id})}"
              th:object="${user}" 
              class="p-8 md:p-10 grid grid-cols-1 md:grid-cols-12 gap-12"> 

            <input type="hidden" th:field="*{id}">

            <div class="md:col-span-7 space-y-8">
                
                <div class="border-b border-slate-100 pb-4">
                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="bi bi-person-circle text-purple-600"></i> Dados Pessoais
                    </h3>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    
                    <div class="flex flex-col md:col-span-2 bg-slate-50 p-4 rounded-2xl border border-slate-200 border-dashed">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Foto de perfil</label>
                        <input type="file" th:field="*{fotoPerfil}"
                               class="text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100 cursor-pointer"/>
                    </div>

                    <div class="flex flex-col">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Nome completo</label>
                        <input type="text" th:field="*{name}" placeholder="Digite seu nome"
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all"/>
                    </div>

                    <div class="flex flex-col">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Username</label>
                        <input type="text" th:field="*{nameUser}" placeholder="@usuario"
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all"/>
                    </div>

                    <div class="flex flex-col">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Nascimento</label>
                        <input type="date" th:field="*{dataNasc}"
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-purple-500 cursor-pointer"/>
                    </div>

                    <div class="flex flex-col">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Gênero</label>
                        <select th:field="*{genero}" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-purple-500 appearance-none cursor-pointer">
                            <option value="">Selecione</option>
                            <option value="MASCULINO">Masculino</option>
                            <option value="FEMININO">Feminino</option>
                            <option value="OUTRO">Outro</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Cargo</label>
                        <input type="text" th:field="*{cargo}" placeholder="Ex: Desenvolvedor"
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-purple-500"/>
                    </div>

                    <div class="flex flex-col">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Empresa</label>
                        <input type="text" th:field="*{empresa}" placeholder="Onde trabalha?"
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-purple-500"/>
                    </div>

                    <div class="flex flex-col md:col-span-2">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Sobre você</label>
                        <textarea th:field="*{descricao}" rows="4" placeholder="Conte sua trajetória..."
                                  class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all resize-none"></textarea>
                    </div>
                </div>
            </div>

            <div class="md:col-span-5 space-y-8">
                
                <div class="bg-slate-50 p-6 rounded-3xl border border-slate-200 space-y-6">
                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2 border-b border-slate-200 pb-3">
                        <i class="bi bi-telephone text-purple-600"></i> Contato
                    </h3>
                    
                    <div class="flex flex-col">
                        <label class="mb-2 text-xs font-bold text-slate-500 uppercase">E-mail</label>
                        <input type="email" th:field="*{email}"
                               class="bg-white border border-slate-200 rounded-xl px-4 py-2.5 outline-none focus:border-purple-500"/>
                    </div>

                    <div class="flex flex-col">
                        <label class="mb-2 text-xs font-bold text-slate-500 uppercase">Telefone</label>
                        <input type="tel" th:field="*{telefone}"
                               class="bg-white border border-slate-200 rounded-xl px-4 py-2.5 outline-none focus:border-purple-500"/>
                    </div>
                </div>

                <div class="bg-indigo-900 p-6 rounded-3xl shadow-lg shadow-indigo-100 text-white space-y-6">
                    <h3 class="text-lg font-bold flex items-center gap-2 border-b border-indigo-800 pb-3">
                        <i class="bi bi-globe"></i> Redes Sociais
                    </h3>
                    
                    <div th:each="link, stat : ${user.link}" class="space-y-3 p-3 bg-indigo-800/40 rounded-2xl border border-indigo-700">
                        <input type="hidden" th:field="*{link[__${stat.index}__].id}" />
                        
                        <select th:field="*{link[__${stat.index}__].tipoLink}"
                                class="w-full bg-indigo-900/50 border border-indigo-600 rounded-lg px-2 py-2 text-sm outline-none focus:border-purple-400">
                            <option th:value="${null}">Selecione o tipo</option>
                            <option th:each="tipo : ${tipoLink}" th:value="${tipo}" th:text="${tipo}"></option>
                        </select>

                        <input type="text" th:field="*{link[__${stat.index}__].url}" placeholder="URL do perfil"
                               class="w-full bg-indigo-900/50 border border-indigo-600 rounded-lg px-3 py-2 text-sm outline-none focus:border-purple-400 placeholder:text-indigo-400"/>
                    </div>
                </div>
            </div>

            <div class="md:col-span-12 flex flex-col-reverse md:flex-row justify-end gap-4 border-t border-slate-100 pt-10 mt-6">
                <a th:href="@{/panelUser}" 
                   class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-bold px-10 py-4 rounded-2xl transition text-center active:scale-95">
                    Cancelar
                </a> 
                <button type="submit" 
                        class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-14 py-4 rounded-2xl shadow-xl shadow-purple-200 transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-3">
                    <i class="bi bi-floppy-fill"></i> Salvar Alterações
                </button>
            </div>

        </form>
    </div>
</div>
