<div class="flex min-h-screen  py-12 pl-0 md:pl-64 m-auto justify-center items-start font-sans" th:fragment="createdProject">
    
    <div class="w-full max-w-5xl bg-white rounded-3xl  shadow-sm border border-slate-200 overflow-hidden mx-6">
        
        <div class="bg-gradient-to-r from-purple-700 to-indigo-600 px-8 py-10 text-white">
            <h2 class="text-3xl font-extrabold tracking-tight">
                Novo Projeto
            </h2>
            <p class="text-purple-100 mt-2">Transforme sua ideia em um projeto memorável.</p>
        </div>

        <form th:action="@{/projetos/createdCard}" 
              th:object="${projeto}" 
              method="post" 
              class="p-8 md:p-10 grid grid-cols-1 md:grid-cols-12 gap-12">

            <div class="md:col-span-7 space-y-6">
                
                <div class="border-b border-slate-100 pb-4 mb-4">
                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="bi bi- cast text-purple-600"></i> Detalhes do Projeto
                    </h3>
                </div>

                <div class="flex flex-col">
                    <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Título do Projeto</label>
                    <input type="text" th:field="*{titulo}" placeholder="Ex: App de Gestão Financeira"
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all placeholder:text-slate-400"/>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Status</label>
                        <select th:field="*{status}" id="status" 
                                class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none focus:border-purple-500 appearance-none cursor-pointer">
                            <option value="SELECT_OPTION">Selecione a opção</option>
                            <option value="EM_ANDAMENTO">🚀 Em andamento</option>
                            <option value="CONCLUIDO">✅ Concluído</option>
                            <option value="CANCELADO">🛑 Cancelado</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Data de Conclusão</label>
                        <input type="date" th:field="*{dataConclusao}" 
                               class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none focus:border-purple-500 cursor-pointer"/>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Descrição</label>
                    <textarea th:field="*{descricao}" rows="4" placeholder="Conte os detalhes do projeto..."
                              class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all resize-none"></textarea>
                </div>
            </div>

            <div class="md:col-span-5 flex flex-col space-y-6">
                
                <div class="border-b border-slate-100 pb-4 mb-4">
                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="bi bi-tags text-purple-600"></i> Classificação
                    </h3>
                </div>
                
                <div class="flex flex-col">
                    <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Tecnologias (Tags)</label>
                    <div id="tag-container"
                         class="bg-slate-50 border-2 border-dashed border-slate-200 rounded-2xl px-4 py-4 min-h-[100px] flex flex-wrap gap-2 cursor-text hover:border-purple-400 transition-all"
                         onclick="document.getElementById('tag-input').focus()">
                        <input id="tag-input" type="text"
                               placeholder="Digite e use ';'..."
                               class="outline-none flex-grow min-w-[120px] bg-transparent text-sm"/>
                    </div>
                    <input type="hidden" th:field="*{tecnologiasText}" id="tecnologiasText">
                </div>

                <div class="bg-indigo-900 p-6 rounded-3xl shadow-lg shadow-indigo-200 text-white space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="font-bold block">Publicar Projeto</span>
                            <p class="text-xs text-indigo-200">Visível na área de exploração.</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" th:field="*{isPublish}" class="sr-only peer">
                            <div class="w-14 h-7 bg-indigo-700/50 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-400"></div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="md:col-span-12 flex flex-col-reverse md:flex-row justify-end gap-4 border-t border-slate-100 pt-10 mt-6">
                <button type="button" onclick="window.history.back()"
                   class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-bold px-10 py-4 rounded-2xl transition active:scale-95">
                    Voltar
                </button>
                <button type="submit"
                        class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-14 py-4 rounded-2xl shadow-xl shadow-purple-200 transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-3">
                    <i class="bi bi-check-circle-fill"></i> Salvar Projeto
                </button>
            </div>
        </form>

        <div class="px-8 pb-8">
            <div th:if="${mensagemErro}" role="alert" class="p-4 bg-red-50 border border-red-100 text-red-600 rounded-2xl flex items-center gap-3 animate-pulse">
                <i class="bi bi-exclamation-octagon-fill"></i>
                <p th:text="${mensagemErro}" class="font-semibold text-sm"></p>
            </div>
            <div th:if="${mensagemSucesso}" role="alert" class="p-4 bg-emerald-50 border border-emerald-100 text-emerald-600 rounded-2xl flex items-center gap-3">
                <i class="bi bi-check-all text-xl"></i>
                <p th:text="${mensagemSucesso}" class="font-semibold text-sm"></p>
            </div>
        </div>
    </div>
</div>

<script src="/js/tags.js"></script>
<script src="/js/alteracaoCorSelect.js"></script>
<script src="/js/notificacao.js"></script>
