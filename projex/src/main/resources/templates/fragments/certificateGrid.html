<main th:fragment="certificadosGrid(certificados, extraClass)"
      class="w-full max-w-full"
      th:classappend="${extraClass}">

    <div th:class="'grid gap-4 ' + ${extraClass ?: 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3'}">

        <div th:each="cert : ${certificados}"
             class="group bg-white mt-5 rounded-2xl p-5 border border-gray-100 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between relative overflow-hidden">

            <div class="flex flex-col space-y-3">
                <div class="flex justify-between items-start gap-4">
                    <h4 class="text-sm font-bold text-gray-800 leading-tight" th:text="${cert.titulo}">
                        Título do Certificado
                    </h4>
                    
                    <div class="w-8 h-8 bg-amber-50 text-amber-500 rounded-lg flex items-center justify-center flex-shrink-0">
                        <i class="bi bi-patch-check-fill"></i>
                    </div>
                </div>

                <div class="flex flex-wrap items-center gap-2">
                    <span class="flex items-center gap-1.5 text-[10px] font-bold text-indigo-500 bg-indigo-50 px-2 py-1 rounded-md uppercase tracking-wider">
                        <i class="bi bi-layers-fill"></i>
                        <span th:text="${cert.category.label}">Categoria</span>
                    </span>

                    <span th:text="${cert.status.label}"
                          class="text-[9px] uppercase tracking-tighter font-black px-2 py-1 rounded-md border"
                          th:classappend="${cert.status.cssClass ?: 'bg-gray-50 text-gray-400 border-gray-100'}">
                    </span>
                </div>

            </div>

            <div class="mt-4 pt-3 border-t border-gray-50 flex justify-end">
                <a th:href="@{/panelCertificados/{id}/editar(id=${cert.id})}" 
                   class="text-gray-300 group-hover:text-amber-500 transition-colors">
                    <i class="bi bi-arrow-up-right-square text-lg"></i>
                </a>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(certificados)}"
         class="py-10 text-center flex flex-col items-center justify-center gap-3 border-2 border-dashed border-gray-100 rounded-[2rem] bg-gray-50/30">
        <i class="bi bi-award text-3xl text-gray-200"></i>
        <p class="text-gray-400 text-xs font-medium">Nenhum certificado disponível.</p>
    </div>


</main>
