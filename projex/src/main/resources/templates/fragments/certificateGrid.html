<main
    th:fragment="certificadosGrid(certificados, extraClass)"
    class="w-full max-w-full"
    th:classappend="${extraClass}">

    <div th:class="'grid gap-6 ' + ${extraClass ?: 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3'}">

        <!-- CARD -->
        <div
            th:each="cert : ${certificados}"
            class="group bg-white rounded-3xl p-6 border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 relative flex flex-col justify-between overflow-hidden">

            <div class="flex flex-col space-y-3">
                <div class="flex justify-between items-start">

                    <!-- TÍTULO -->
                    <a th:href="@{/panelCertificados/{id}/editar(id=${cert.id})}" class="text-lg font-semibold text-[#1F2937] cursor-pointer hover:text-[#0D6EFD]"
                         th:text="${cert.titulo}">
                    </a>

                    <!-- MENU -->
                    <details class="relative" onclick="event.stopPropagation();">
                        <summary class="list-none cursor-pointer p-2 rounded-full hover:bg-gray-100">
                            <i class="bi bi-three-dots-vertical text-xl"></i>
                        </summary>

                        <div class="absolute right-0 mt-2 w-40 rounded-lg bg-white shadow-lg z-50">
                            <ul class="py-1 text-sm">
                                <li class="px-4 py-2 hover:bg-gray-100">
                                    Editar
                                </li>

                                <li class="px-4 py-2 text-red-600 hover:bg-red-50">
                                        <button
                                            type="button"
                                            th:attr="onclick=|openDeleteModal('/panelCertificados/${cert.id}/deletar')|"
                                            class="w-full text-left py-2 text-red-600 hover:bg-red-50">
                                            Excluir
                                        </button>
                                </li>
                            </ul>
                        </div>
                    </details>

                </div>

                <!-- DONO + STATUS -->
                <div class="flex flex-wrap items-center gap-3 mb-4">
                    <span th:text="${cert.status.label}"
                          class="text-[10px] uppercase bg-green-100 tracking-wider font-bold px-2.5 py-1 rounded-full shadow-sm"
                          th:classappend="${cert.status.cssClass}">
                    </span>
                    
                    <div class="flex items-center gap-1.5 text-sm text-gray-500">
                        <i class="bi bi-person-circle text-purple-400"></i>
                        <span th:text="${cert.dono != null ? cert.dono.name : 'Sem dono'}"></span>
                    </div>
                </div>
            <a class="flex flex-row gap-1 text-sm cursor-pointer w-[15rem] font-medium text-[#0D6EFD] hover:text-[black] duration-300 transform transition-transform " 
            th:href="@{/panelCertificados(search=${search}, category=${cert.category})}">
                <i class="bi bi-layers-fill"></i>
                <span th:text="${cert.category.label}"></span>
            </a>

            </div>

        </div>

    </div>

    <!-- SEM RESULTADOS -->
    <div th:if="${#lists.isEmpty(certificados)}"
         class="mt-6 text-center text-gray-500">
        Nenhum certificado encontrado.

        

    </div>
    <div th:if="${mensagemErro}" 
                role="alert" 
                id="alert"
                >
                <p th:text="${mensagemErro}" class="font-medium"></p>
            </div>
            
                <div th:if="${mensagemSucesso}" 
                role="alert" 
                id="alert-sucesso"
                th:text="${mensagemSucesso}">
                
            </div>

</main>
