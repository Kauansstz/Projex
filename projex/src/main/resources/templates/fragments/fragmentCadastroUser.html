<div class="flex flex-center bg-white rounded-lg w-[28rem] h-auto px-[15px] py-[18px]" th:fragment="cadastro">
    <div class="flex flex-col px-[21px]">
        <h2 class="font-sans flex justify-center font-bold text-[45px]">Projex</h2>
            <div class="flex flex-col justify-center space-y-4  w-[40px]" id="containerCadastro"></div>

        <!-- Mensagem de erro -->
    <div th:if="${mensagemErro}" 
     role="alert" 
     id="alert"
     >
        <p th:text="${mensagemErro}" class="font-medium"></p>
    </div>

    <div th:if="${mensagemSucesso}" 
        role="alert" 
            id="alert-sucesso">
        <p th:text="${mensagemSucesso}" class="font-medium"></p>
    </div>



    </div>
</div>
