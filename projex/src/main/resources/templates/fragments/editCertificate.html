<div class="flex min-h-screen bg-slate-50 py-12 pl-0 md:pl-64 justify-center items-start font-sans" th:fragment="editCertificate">
    
    <div class="w-full max-w-5xl bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden mx-6">
        
        <div class="bg-gradient-to-r from-purple-700 to-indigo-600 px-8 py-10 text-white">
            <h2 class="text-3xl font-extrabold tracking-tight">
                Editar Certificado
            </h2>
            <p class="text-purple-100 mt-2">Atualize as informações da sua conquista abaixo.</p>
        </div>

        <form th:action="@{/panelCertificados/{id}/editar(id=${certificado.id})}" 
              th:object="${certificado}" 
              method="post" 
              enctype="multipart/form-data"
              class="p-8 md:p-10 grid grid-cols-1 md:grid-cols-12 gap-12">

            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{anexoNome}">

            <div class="md:col-span-7 space-y-6">
                
                <div class="border-b border-slate-100 pb-4 mb-4">
                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="bi bi-pencil-square text-purple-600"></i> Informações Gerais
                    </h3>
                </div>

                <div class="flex flex-col">
                    <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Título da Conquista</label>
                    <input type="text" th:field="*{titulo}" placeholder="Ex: Especialista em Spring Boot"
                           class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all placeholder:text-slate-400"/>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="flex flex-col autocomplete-container relative">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Instituição Emissora</label>
                        <input type="text" th:field="*{instituicao}" placeholder="Nome da escola/empresa" id="instituicaoInput" autocomplete="off"
                               class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all"/>
                        <ul id="instituicaoList" class="absolute z-20 w-full bg-slate-900 border border-slate-700 rounded-xl mt-20 hidden max-h-48 overflow-y-auto text-white shadow-xl"></ul>
                    </div>

                    <div class="flex flex-col autocomplete-container relative">
                        <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Tipo de Formação</label>
                        <input type="text" th:field="*{typeCertificate}" placeholder="Ex: Bacharelado, Workshop" id="TypeInput" autocomplete="off"
                               class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all"/>
                        <ul id="TypeList" class="absolute z-20 w-full bg-slate-900 border border-slate-700 rounded-xl mt-20 hidden max-h-48 overflow-y-auto text-white shadow-xl"></ul>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label class="mb-2 text-sm font-bold text-slate-700 uppercase tracking-wider">Resumo ou Descrição</label>
                    <textarea th:field="*{descricao}" rows="4" placeholder="O que você aprendeu neste curso?"
                              class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none focus:ring-4 focus:ring-purple-500/10 focus:border-purple-500 transition-all resize-none"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="flex flex-col">
                        <label class="mb-2 text-sm font-bold text-slate-700">Status</label>
                        <select th:field="*{status}" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none focus:border-purple-500 appearance-none cursor-pointer">
                            <option value="">Selecione</option>
                            <option value="EM_ANDAMENTO">Em andamento</option>
                            <option value="CONCLUIDO">Concluído</option>
                            <option value="CANCELADO">Cancelado</option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label class="mb-2 text-sm font-bold text-slate-700">Data de Conclusão</label>
                        <input type="date" th:field="*{dataConclusao}" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none focus:border-purple-500 cursor-pointer"/>
                    </div>

                    <div class="flex flex-col">
                        <label class="mb-2 text-sm font-bold text-slate-700">Categoria</label>
                        <select id="categoria" th:field="*{category}" class="bg-slate-50 border border-slate-200 rounded-xl px-4 py-3.5 outline-none focus:border-purple-500 cursor-pointer">
                            <option value="">Selecione...</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.name()}" th:text="${cat.label}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="md:col-span-5 flex flex-col space-y-6">
                
                <div class="border-b border-slate-100 pb-4 mb-4">
                    <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="bi bi-file-earmark-arrow-up text-purple-600"></i> Documentação
                    </h3>
                </div>
                
                <div id="previewContainer" 
                     th:classappend="${certificado?.anexoNome != null ? '' : 'hidden'}"
                     class="relative group flex flex-col items-center justify-center bg-slate-50 border-2 border-dashed border-slate-300 rounded-3xl p-6 min-h-[300px] hover:border-purple-400 transition-colors">
                    
                    <img id="imagePreview" 
                         th:src="${certificado.anexoNome != null} ? '/uploads/' + ${certificado.anexoNome} : ''"
                         th:classappend="${certificado.anexoNome != null} ? '' : 'hidden'"
                         class="rounded-xl max-h-72 object-contain shadow-xl mb-4 ring-4 ring-white" />
                    
                    <a id="downloadLink" 
                       th:if="${certificado.anexoNome != null}"
                       th:href="@{/uploads/{nome}(nome=${certificado.anexoNome})}" 
                       th:download="${certificado.anexoNome}"
                       class="inline-flex items-center gap-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold py-2 px-6 rounded-xl transition shadow-sm">
                        <i class="bi bi-download text-purple-600"></i> Baixar Atual
                    </a>
                </div>

                <label for="fileInput" id="uploadBtn"
                    class="group relative flex flex-col items-center justify-center gap-3 bg-purple-50 border-2 border-purple-200 w-full py-8 rounded-3xl cursor-pointer hover:bg-purple-100 transition-all border-dashed overflow-hidden">
                    
                    <div id="progressBar" class="absolute bottom-0 left-0 h-1.5 bg-purple-600 transition-all duration-300" style="width: 0%"></div>
                    
                    <div class="w-14 h-14 bg-white rounded-full flex items-center justify-center shadow-md group-hover:scale-110 transition-transform">
                        <i class="bi bi-cloud-arrow-up text-2xl text-purple-600" id="icon"></i>
                    </div>
                    
                    <div class="text-center">
                        <span id="fileName" class="font-bold text-purple-900 block" th:text="${certificado?.anexoNome != null ? certificado.anexoNome : 'Trocar Arquivo'}">Clique para alterar</span>
                        <span class="text-xs text-purple-400">PDF, PNG ou JPG (Max. 5MB)</span>
                    </div>
                </label>
                
                <input type="file" id="fileInput" class="hidden" th:field="*{anexo}">

                <div class="bg-indigo-900 p-6 rounded-3xl shadow-lg shadow-indigo-200 text-white space-y-4">
                    <div class="flex justify-between items-center">
                        <div>
                            <span class="font-bold block">Visibilidade Pública</span>
                            <p class="text-xs text-indigo-200">Exibir este certificado no seu perfil público.</p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" th:field="*{isPublish}" class="sr-only peer">
                            <div class="w-14 h-7 bg-indigo-700/50 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-400"></div>
                        </label>
                    </div>
                </div>
            </div>

            <div class="md:col-span-12 flex flex-col-reverse md:flex-row justify-end gap-4 border-t border-slate-100 pt-10 mt-6">
                <a th:href="@{/panelCertificados}"
                   class="bg-white border border-slate-200 hover:bg-slate-50 text-slate-600 font-bold px-10 py-4 rounded-2xl transition active:scale-95 text-center">
                    Cancelar
                </a>
                <button type="submit"
                        class="bg-purple-600 hover:bg-purple-700 text-white font-bold px-14 py-4 rounded-2xl shadow-xl shadow-purple-200 transition-all transform hover:-translate-y-1 active:scale-95 flex items-center justify-center gap-3">
                    <i class="bi bi-save-fill"></i> Salvar Alterações
                </button>
            </div>
        </form>
    </div>

    <div id="imageModal" class="fixed inset-0 bg-slate-900/95 hidden items-center justify-center z-50 backdrop-blur-sm p-4">
        <button id="closeModal" class="absolute top-6 right-6 text-white bg-white/10 w-12 h-12 rounded-full flex items-center justify-center hover:bg-white/20 transition text-2xl">&times;</button>
        <img id="modalImage" class="max-h-full max-w-full rounded-2xl shadow-2xl transition-transform duration-300">
    </div>

</div>
