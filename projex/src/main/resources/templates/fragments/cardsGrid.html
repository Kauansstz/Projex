<div th:fragment="cardsGrid(cards, extraClass)" class="w-full">
    
    <div th:unless="${#lists.isEmpty(cards)}" 
         class="grid gap-5 w-[45rem]" 
         th:classappend="${extraClass ?: 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3'}">

        <div th:each="card : ${cards}"
             class="group  bg-white rounded-[2rem] p-5 border border-gray-100 shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between relative overflow-hidden">
            
            <div class="flex flex-col space-y-3">
                <div class="flex justify-between items-start">
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center shadow-sm"
                         th:classappend="${type == 'CERTIFICADO' ? 'bg-amber-50 text-amber-500' : 'bg-indigo-50 text-[#6366F1]'}">
                        <i th:class="${type == 'CERTIFICADO' ? 'bi bi-award-fill' : 'bi bi-folder-fill'}"></i>
                    </div>
                    <span class="text-[9px] font-black text-gray-300 uppercase tracking-widest" 
                          th:text="${type == 'CERTIFICADO' ? 'Certificado' : 'Projeto'}">Tipo</span>
                </div>

                <h4 class="text-base font-bold text-gray-800 leading-tight block truncate"
                    th:text="${type == 'CERTIFICADO' ? card.nome : card.titulo}">
                    Título
                </h4>

                <div class="pt-1" th:if="${type != 'CERTIFICADO' and card.tecnologiasText != null}">
                    <div class="flex flex-wrap gap-1">
                        <span th:each="tech : ${#strings.arraySplit(card.tecnologiasText, ';')}"
                              th:text="${tech.trim()}"
                              class="text-[10px] font-bold bg-gray-50 text-gray-400 border border-gray-100 px-2 py-0.5 rounded-lg">
                        </span>
                    </div>
                </div>

                <div class="pt-1" th:if="${type == 'CERTIFICADO'}">
                    <p class="text-[11px] text-gray-500 flex items-center gap-1">
                        <i class="bi bi-bank text-[10px]"></i>
                        <span th:text="${card.instituicao ?: 'Instituição não informada'}">Instituição</span>
                    </p>
                </div>
            </div>
            
            <div class="mt-4 pt-3 border-t border-gray-50 flex justify-end">
                <a th:href="${type == 'CERTIFICADO' ? '/certificados/editar/' + card.id : '/panelProjetos/editar/' + card.id}" 
                   class="text-gray-300 group-hover:text-[#6366F1] transition-colors">
                    <i class="bi bi-arrow-right-short text-2xl"></i>
                </a>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(cards)}"
         class="p-8 text-center bg-gray-50/50 rounded-[2rem] border-2 border-dashed border-gray-100 w-full flex flex-col items-center justify-center gap-3">
        <div class="w-12 h-12 bg-white rounded-2xl flex items-center justify-center shadow-sm">
            <i class="bi bi-inbox text-gray-300 text-xl"></i>
        </div>
        <p class="text-gray-400 text-xs font-medium" 
           th:text="${type == 'CERTIFICADO' ? 'Nenhum certificado cadastrado.' : 'Nenhum projeto encontrado.'}">Aviso</p>
    </div>
</div>
