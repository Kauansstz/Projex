<div th:fragment="cardsGrid(cards, extraClass)" 
     class="w-screen" 
     th:classappend="${extraClass}">

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-4">

        <div th:each="card : ${cards}"
             class="group bg-white rounded-3xl p-6 border border-gray-100 shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all duration-300 relative flex flex-col justify-between">
            
            <div class="flex flex-col space-y-3">
                <div class="flex justify-between items-start">
                    <div class="w-10 h-10 bg-indigo-50 text-[#6366F1] rounded-xl flex items-center justify-center">
                        <i class="bi bi-folder-fill"></i>
                    </div>
                    <span class="text-[10px] font-black text-gray-300 uppercase tracking-widest">Projeto</span>
                </div>

                <a th:href="@{/panelProjetos/editar/{id}(id=${card.id})}" 
                   class="text-lg font-bold text-gray-800 hover:text-[#6366F1] transition-colors leading-tight block"
                   th:text="${card.titulo}">
                    Título do Projeto
                </a>

                    <div class="pt-2">
                        <p class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter mb-2">Tecnologias utilizadas</p>
                        <div class="flex flex-wrap gap-1.5 mt-2" th:if="${card.tecnologiasText != null}">
                        <span th:each="tech : ${#strings.arraySplit(card.tecnologiasText, ';')}"
                            th:text="${tech.trim()}"
                            class="text-[11px] font-medium bg-gray-50 text-gray-500 border border-gray-200 px-2 py-0.5 rounded-md">
                        </span>
                    </div>
                </div>
            </div>
            
            <div class="mt-4 pt-4 border-t border-gray-50 flex justify-end">
                <i class="bi bi-arrow-right text-gray-300 group-hover:text-[#6366F1] transition-colors"></i>
            </div>
        </div>
    </div>

    <div th:if="${#lists.isEmpty(cards)}"
         class="mt-10 p-10 text-center bg-gray-50 rounded-3xl border-2 border-dashed border-gray-200">
        <i class="bi bi-inbox text-4xl text-gray-300"></i>
        <p class="mt-2 text-gray-500 font-medium">Nenhum projeto encontrado.</p>
    </div>
</div>
