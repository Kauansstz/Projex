<div class="flex flex-col m-auto ml-0 lg:ml-[16rem] 2xl:ml-[20rem] p-4 lg:p-8 w-full max-w-[1200px]" th:fragment="aboutAccount">
    
    <div class="bg-white rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden relative">
        
        <div class="h-32 bg-gradient-to-r from-[#6366F1] to-[#8B5CF6] relative">
            <button onclick="history.back()" 
                    class="absolute top-6 left-6 bg-white/20 hover:bg-white/40 text-white p-2 rounded-xl backdrop-blur-md transition-all">
                <i class="bi bi-arrow-left text-xl"></i>
            </button>
        </div>

        <div class="px-6 md:px-10 pb-12">
            
            <div class="relative flex flex-col md:flex-row md:items-end gap-6 -mt-12 mb-10">
                <div class="w-32 h-32 bg-white rounded-[2.5rem] p-2 shadow-lg flex-shrink-0 mx-auto md:mx-0 overflow-hidden">
                <div class="w-full h-full bg-gray-100 rounded-[2rem] flex items-center justify-center text-[#6366F1]">
                    
                    <i th:if="${usuario.fotoPerfil == null or usuario.fotoPerfil.isEmpty()}" 
                    class="bi bi-person-circle text-6xl"></i>

                    <img th:unless="${usuario.fotoPerfil == null or usuario.fotoPerfil.isEmpty()}" 
                        th:src="${usuario.fotoPerfil}" 
                        alt="Foto de Perfil"
                        class="w-full h-full object-cover rounded-[2rem]">
                        
                </div>
            </div>
                
                <div class="flex-1 pb-2 text-center md:text-left">
                    <h2 class="text-3xl font-black text-gray-900 leading-tight" th:utext="${usuario.name}">Nome do usuário</h2>
                    <p class="text-[#6366F1] font-medium tracking-wide uppercase text-xs mt-1" th:utext="${usuario.descricao}">Descrição do usuário</p>
                </div>
                
                <div class="flex gap-3 pb-2 justify-center md:justify-end">
                    <a th:href="@{/editAccount/{id}/editar(id = ${usuario.id})}" title="Editar Perfil"
                       class="p-3 bg-gray-50 hover:bg-blue-50 text-gray-400 hover:text-blue-600 rounded-2xl transition-all border border-gray-100">
                        <i class="bi bi-pencil-square text-xl"></i>
                    </a>

                    <details class="relative">
                        <summary class="list-none cursor-pointer p-3 bg-gray-50 hover:bg-gray-100 text-gray-400 hover:text-gray-600 rounded-2xl transition-all border border-gray-100">
                            <i class="bi bi-three-dots-vertical text-xl"></i>
                        </summary>
                        
                        <div class="absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-2xl border border-gray-100 z-50 py-2 overflow-hidden animate-fade-in-down">
                            <p class="px-4 py-1.5 text-xs font-black text-gray-400 uppercase tracking-widest">Relatórios</p>
                            <hr class="border-gray-100 my-1">
                            
                            <a th:href="@{/historico}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-orange-50 hover:text-orange-700 transition-colors">
                                <i class="bi bi-eye text-orange-400"></i> Visualizar Histórico
                            </a>
                            
                            <a href="/historico/api/v1/exportCSV" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-green-50 hover:text-green-700 transition-colors">
                                <i class="bi bi-file-earmark-spreadsheet text-green-500"></i> Exportar CSV
                            </a>
                        </div>
                    </details>
                </div>
            </div>

            <div class="space-y-12 max-w-full">
                
                <section class="max-w-3xl">
                    <h3 class="text-lg font-bold text-gray-800 mb-5 flex items-center gap-3">
                        <i class="bi bi-chat-left-text text-[#6366F1] text-xl"></i> Sobre
                    </h3>
                    <div class="bg-gray-50 rounded-2xl p-7 border border-gray-100 leading-relaxed text-gray-600 text-sm shadow-inner shadow-gray-100/50" th:utext="${usuario.sobre}">
                        Sobre
                    </div>
                </section>

                <section class="w-full">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-lg font-bold text-gray-800 flex items-center gap-3">
                            <i class="bi bi-code-slash text-[#6366F1] text-xl"></i> Últimos Projetos
                        </h3>
                    </div>

                    <div class="bg-gray-100 border border-gray-100 rounded-3xl p-8 shadow-sm w-full h-auto overflow-hidden">
                        <div th:replace="~{fragments/cardsGrid :: cardsGrid(${ultimosProjetos}, 'grid-cols-1 md:grid-cols-2 lg:grid-cols-3')}"></div>
                    </div>
                </section>
                
                <section class="w-full">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-lg font-bold text-gray-800 flex items-center gap-3">
                            <i class="bi bi-award text-[#6366F1] text-xl"></i> Experiência & Certificados
                        </h3>
                        <a href="#" class="p-2 bg-indigo-50 text-[#6366F1] rounded-lg hover:bg-[#6366F1] hover:text-white transition-all">
                            <i class="bi bi-plus-lg"></i>
                        </a>
                    </div>
                    <div class="bg-gray-100 border border-gray-100 rounded-3xl p-8 shadow-sm w-full h-auto overflow-hidden">
                        <div th:replace="~{fragments/certificateGrid :: certificadosGrid(${certificados}, '')}"></div>
                    </div>
                </section>
                
            </div>
             <div th:if="${mensagemErro}" 
        role="alert" 
        id="alert"
        >
        <p th:text="${mensagemErro}" class="font-medium"></p>
    </div>
    
        <div th:if="${mensagemSucesso}" 
        role="alert" 
        id="alert-sucesso"
        th:text="${mensagemSucesso}">
        
    </div>
         </div>
    </div>
</div>
