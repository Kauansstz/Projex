<div class="flex flex-col m-auto ml-0 lg:ml-[16rem] 2xl:ml-[20rem] p-4 lg:p-8 w-full max-w-[1200px]" th:fragment="aboutAccount">
    
    <div class="bg-white rounded-[2rem] shadow-sm border border-gray-100 overflow-hidden relative">
        
        <div class="h-32 bg-gradient-to-r from-[#6366F1] to-[#8B5CF6] relative">
            <button onclick="history.back()" 
                    class="absolute top-6 left-6 bg-white/20 hover:bg-white/40 text-white p-2 rounded-xl backdrop-blur-md transition-all">
                <i class="bi bi-arrow-left text-xl"></i>
            </button>
        </div>

        <div class="px-6 md:px-10 pb-12">
            
            <div class="relative flex flex-col md:flex-row md:items-end gap-6 -mt-12 mb-10">
                <div class="w-32 h-32 bg-white rounded-[2.5rem] p-2 shadow-lg flex-shrink-0 mx-auto md:mx-0 overflow-hidden">
                    <div class="w-full h-full bg-gray-100 rounded-[2rem] flex items-center justify-center text-[#6366F1]">
                        <i th:if="${usuario.fotoPerfil == null or usuario.fotoPerfil.isEmpty()}" class="bi bi-person-circle text-6xl"></i>
                        <img th:unless="${usuario.fotoPerfil == null or usuario.fotoPerfil.isEmpty()}" 
                             th:src="${usuario.fotoPerfil}" 
                             alt="Foto de Perfil"
                             class="w-full h-full object-cover rounded-[2rem]">
                    </div>
                </div>
                
                <div class="flex-1 pb-2 pt-8 text-center md:text-left">
                    <h2 class="text-3xl font-black text-gray-900 mt-[16px] leading-tight" th:utext="${usuario.name}">Nome do usuário</h2>
                    <p class="text-[#6366F1] font-medium tracking-wide uppercase text-xs mt-1" th:utext="${usuario.descricao}">Descrição</p>
                    <div class="flex flex-wrap justify-center md:justify-start gap-4 mt-3 text-gray-500 text-sm">
                        <span th:if="${usuario.empresa != null}" class="flex items-center gap-1">
                            <i class="bi bi-building text-gray-400"></i> [[${usuario.empresa}]]
                        </span>
                        <span th:if="${usuario.email != null}" class="flex items-center gap-1">
                            <i class="bi bi-envelope text-gray-400"></i> [[${usuario.email}]]
                        </span>
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <div th:each="item : ${usuario.link}" class="relative group"> <div th:data-link="${item.url}"
                             onclick="copiarLink(this)"
                             class="p-3 bg-gray-50 hover:bg-blue-50 text-gray-400 hover:text-blue-600 rounded-2xl cursor-pointer transition-all border border-gray-100">
                            
                            <span class="absolute -top-10 left-1/2 -translate-x-1/2 scale-0 group-hover:scale-100 transition-all duration-200 origin-bottom bg-gray-800 text-white text-xs px-3 py-1.5 rounded-lg whitespace-nowrap z-10">
                                Clique para copiar
                            </span>

                            <div th:if="${item.tipoLink != null}" th:switch="${item.tipoLink.name()}">
                                <i th:case="'GITHUB'" class="bi bi-github text-xl"></i>
                                <i th:case="'LINKEDIN'" class="bi bi-linkedin text-xl"></i>
                                <i th:case="'PORTFOLIO'" class="bi bi-code text-xl"></i>
                                <i th:case="*" class="bi bi-link-45deg text-xl"></i>
                            </div>
                        </div>
                    </div>

                    <a th:href="@{/editAccount/{id}/editar(id = ${usuario.id})}" 
                       class="p-3 bg-gray-50 hover:bg-blue-50 text-gray-400 hover:text-blue-600 rounded-2xl border border-gray-100 transition-all">
                        <i class="bi bi-pencil-square text-xl"></i>
                    </a>

                    <details class="relative">
                        <summary class="list-none cursor-pointer p-3 bg-gray-50 hover:bg-gray-100 text-gray-400 rounded-2xl border border-gray-100">
                            <i class="bi bi-three-dots-vertical text-xl"></i>
                        </summary>
                        <div class="absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-2xl border border-gray-100 z-50 py-2 animate-fade-in-down">
                            <p class="px-4 py-1.5 text-xs font-black text-gray-400 uppercase tracking-widest">Relatórios</p>
                            <hr class="border-gray-100 my-1">
                            <a th:href="@{/historico}" class="flex items-center gap-3 px-4 py-2.5 text-sm text-gray-700 hover:bg-orange-50 transition-colors">
                                <i class="bi bi-eye text-orange-400"></i> Histórico
                            </a>
                        </div>
                    </details>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                <div class="lg:col-span-2 space-y-12">
                    <section>
                        <h3 class="text-lg font-bold text-gray-800 mb-5 flex items-center gap-3">
                            <i class="bi bi-chat-left-text text-[#6366F1] text-xl"></i> Sobre
                        </h3>
                        <div class="bg-gray-50/50 rounded-3xl p-7 border border-gray-100 leading-relaxed text-gray-700 text-sm shadow-inner" 
                             th:utext="${#strings.replace(usuario.sobre, '\n', '<br/>')}">
                        </div>
                    </section>

                    <section>
                        <h3 class="text-lg font-bold text-gray-800 mb-6 flex items-center gap-3">
                            <i class="bi bi-code-slash text-[#6366F1] text-xl"></i> Últimos Projetos
                        </h3>
                        <div class="bg-gray-100 border border-gray-100 rounded-3xl p-8">
                            <div th:replace="~{fragments/cardsGrid :: cardsGrid(${ultimosProjetos}, 'grid-cols-1 md:grid-cols-2')}"></div>
                        </div>
                    </section>
                </div>

                <div class="lg:col-span-1 space-y-10">
                    <section>
                        <h3 class="text-gray-800 font-bold flex items-center gap-3 mb-5">
                            <i class="bi bi-cpu text-[#6366F1] text-xl"></i>
                            <span th:text="${usuario.area == 'TI' ? 'Hard Skills' : 'Sistemas'}">Skills</span>
                        </h3>
                        <div class="flex flex-wrap gap-2">
                            <th:block th:if="${usuario.tecnologiasText != null}">
                                <th:block th:with="techs=${#strings.arraySplit(usuario.tecnologiasText, ';')}">
                                    <span th:each="tech : ${techs}" th:text="${tech.trim()}"
                                          class="px-3 py-1.5 bg-white border border-gray-200 text-gray-600 text-xs font-bold rounded-xl shadow-sm hover:border-indigo-200 transition-colors">
                                    </span>
                                </th:block>
                            </th:block>
                        </div>
                    </section>

                    <section>
                        <h3 class="text-lg font-bold text-gray-800 mb-5 flex items-center gap-3">
                            <i class="bi bi-award text-[#6366F1] text-xl"></i> Experiência & Certificados
                        </h3>
                        <div th:replace="~{fragments/certificateGrid :: certificadosGrid(${certificados}, 'grid-cols-1')}"></div>
                    </section>
                </div>
            </div>
        </div>
    </div>
</div>
