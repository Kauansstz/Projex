name: Testes do Sistema

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Build da API
        working-directory: projex
        run: mvn clean package -DskipTests -q

      - name: Iniciar API do Projex
        working-directory: projex
        env:
          SPRING_DATASOURCE_URL: jdbc:h2:mem:projexdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          SPRING_DATASOURCE_DRIVERCLASSNAME: org.h2.Driver
          SPRING_DATASOURCE_USERNAME: sa
          SPRING_DATASOURCE_PASSWORD: ""
          SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
          SPRING_JPA_DEFER_DATASOURCE_INITIALIZATION: "true"
          SPRING_SQL_INIT_MODE: always
          SPRING_SQL_INIT_DATA_LOCATIONS: classpath:sql/*.sql

          API_URL: ${{ secrets.API_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TOKEN_URL: ${{ secrets.TOKEN_URL }}
          USER_AUTH: ${{ secrets.USER_AUTH }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          mvn spring-boot:run > ../app.log 2>&1 &
          
          echo "Aguardando a API inicializar com o H2 na porta 8080..."
          timeout 90s bash -c 'until curl -s http://localhost:8080 > /dev/null; do sleep 2; echo "Aguardando..."; done' || {
            echo "A API falhou ao iniciar ou demorou muito!"
            cat ../app.log
            exit 1
          }

      - name: Verificar Secrets
        env:
          API_URL: ${{ secrets.API_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TOKEN_URL: ${{ secrets.TOKEN_URL }}
          USER_AUTH: ${{ secrets.USER_AUTH }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          echo "API_URL: ${API_URL:+CONFIGURADA}"
          echo "CLIENT_ID: ${CLIENT_ID:+CONFIGURADA}"
          echo "CLIENT_SECRET: ${CLIENT_SECRET:+CONFIGURADA}"
          echo "TOKEN_URL: ${TOKEN_URL:+CONFIGURADA}"
          echo "USER_AUTH: ${USER_AUTH:+CONFIGURADA}"
          echo "PASSWORD: ${PASSWORD:+CONFIGURADA}"
            
      - name: Executar Testes no Sistema
        working-directory: test_sys
        env:
          API_URL: ${{ secrets.API_URL }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          TOKEN_URL: ${{ secrets.TOKEN_URL }}
          USER_AUTH: ${{ secrets.USER_AUTH }}
          PASSWORD: ${{ secrets.PASSWORD }}
        run: cargo run

      - name: Exibir Logs da API em caso de falha
        if: failure()
        run: cat app.log
  monitoring:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Testes no sistema
        working-directory: monitoring
        run: cargo test
        
  stop-staging:
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - name: Parar Staging
        run: echo "Parando ambiente de staging..."

  update-staging:
    needs: stop-staging
    runs-on: ubuntu-latest
    steps:
      - name: Atualizar Staging
        run: echo "Atualizando código em staging..."

  start-staging:
    needs: update-staging
    runs-on: ubuntu-latest
    steps:
      - name: Iniciar Staging
        run: echo "Iniciando ambiente de staging..."

  stop-prod:
    needs: start-staging
    runs-on: ubuntu-latest
    steps:
      - name: Parar Produção
        run: echo "Parando ambiente de produção..."

  deploy:
    needs: stop-prod
    runs-on: ubuntu-latest
    steps:
      - name: Executar Deploy
        run: echo "Aplicando artefatos em produção..."

  start-prod:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Iniciar Produção
        run: echo "Iniciando ambiente de produção..."